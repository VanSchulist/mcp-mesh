[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-mesh"
version = "1.0.0"
description = "The Dynamic Model Context Protocol Gateway & Lazy Tool Router"
readme = "README.md"
authors = [
    { name = "Van Schulist", email = "vanschulist@existentialcloud.dev" }
]
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "ai-agents", "llm", "developer-tools", "token-optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mcp-mesh = "mcp_mesh.cli:main"

[project.urls]
Homepage = "https://github.com/VanSchulist/mcp-mesh"
Repository = "https://github.com/VanSchulist/mcp-mesh.git"
Issues = "https://github.com/VanSchulist/mcp-mesh/issues"
