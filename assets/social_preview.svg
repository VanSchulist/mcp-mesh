<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%" fx="40%" fy="20%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0b0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b26" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0c0f17" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d9f5" />
    </linearGradient>

    <!-- Grid Filter / Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3347" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Dark Space Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#7928ca" opacity="0.25" filter="url(#glow)" />
  <circle cx="1020" cy="380" r="220" fill="#00f2fe" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Card Frame -->
  <rect x="50" y="40" width="1100" height="550" rx="24" fill="none" stroke="#252f44" stroke-width="1.5" />

  <!-- Top Navigation / Studio Tag -->
  <g transform="translate(90, 85)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#141a29" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#00f5a0" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">EXISTENTIAL CLOUD</text>
  </g>

  <!-- Version Pill -->
  <g transform="translate(325, 85)">
    <rect x="0" y="0" width="85" height="34" rx="17" fill="#2e1065" stroke="#9d4edd" stroke-width="1" />
    <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">v1.1.0</text>
  </g>

  <!-- Main Title Area -->
  <text x="90" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">
    mcp-mesh
  </text>
  <text x="495" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#cyanPurpleGrad)" letter-spacing="-1">
    gateway
  </text>

  <!-- Subtitle -->
  <text x="90" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">
    The Dynamic Model Context Protocol Gateway &amp; Lazy Tool Router
  </text>
  <text x="90" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#64748b">
    Aggregate 50+ MCP servers. Slash Turn-0 tokens by 85%–95%. Zero external dependencies.
  </text>

  <!-- Feature Grid Metric Cards -->
  <g transform="translate(90, 360)">
    <!-- Card 1: Token Savings -->
    <g transform="translate(0, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#064e3b" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#34d399">📉</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" fill="#34d399">~90%</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Token Cost Reduction</text>
    </g>

    <!-- Card 2: Zero Dependencies -->
    <g transform="translate(260, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#1e1b4b" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#818cf8">⚡</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" fill="#818cf8">0 Deps</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Pure Python 3.10+ Stdlib</text>
    </g>

    <!-- Card 3: Doctor Diagnostics -->
    <g transform="translate(520, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#4c1d95" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#c084fc">🩺</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#c084fc">doctor</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Health &amp; Latency Probe</text>
    </g>

    <!-- Card 4: SSE Transport -->
    <g transform="translate(780, 0)">
      <rect width="235" height="135" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#0c4a6e" />
      <text x="38" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#38bdf8">🌐</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#38bdf8">SSE/HTTP</text>
      <text x="18" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">Remote &amp; Docker Daemon</text>
    </g>
  </g>

  <!-- Bottom Bar: Creator Info & Live Link -->
  <g transform="translate(90, 545)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">
      Engineered by <tspan fill="#ffffff">Van Schulist</tspan> (@VanSchulist)
    </text>
    <text x="1020" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="end">
      www.existentialcloud.ccwu.cc
    </text>
  </g>
</svg>
